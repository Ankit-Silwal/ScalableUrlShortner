services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d url_shortener"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
